name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore backend/backend.sln

      - name: Build
        run: dotnet build backend/backend.sln --configuration Release --no-restore

      - name: Run backend tests when available
        shell: bash
        run: |
          if find backend -type f -name '*[Tt]est*.csproj' -print -quit | grep -q .; then
            find backend -type f -name '*[Tt]est*.csproj' -print0 | xargs -0 -n1 dotnet test --configuration Release --no-build --no-restore
          else
            echo 'No .NET test project is versioned yet.'
          fi

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@11.12.0

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Test
        working-directory: frontend
        env:
          CI: true
        run: pnpm test --watch=false
